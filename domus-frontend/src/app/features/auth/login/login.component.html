<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Bienvenue sur Domus
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Connectez-vous à votre espace
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">

      <!-- Affichage des erreurs -->
      <div *ngIf="errorMessage" class="mb-4 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md text-sm">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Champ Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Adresse email</label>
          <div class="mt-1">
            <input id="email" type="email" formControlName="email"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   [ngClass]="{'border-red-300 focus:border-red-500 focus:ring-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
                   placeholder="votre@email.com">
          </div>
          <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-2 text-sm text-red-600">
            Veuillez entrer une adresse email valide.
          </p>
        </div>

        <!-- Champ Mot de passe -->
        <div>
          <label for="motDePasse" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <div class="mt-1">
            <input id="motDePasse" type="password" formControlName="motDePasse"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   [ngClass]="{'border-red-300 focus:border-red-500 focus:ring-red-500': loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched}">
          </div>
          <p *ngIf="loginForm.get('motDePasse')?.invalid && loginForm.get('motDePasse')?.touched" class="mt-2 text-sm text-red-600">
            Le mot de passe est requis.
          </p>
        </div>

        <!-- Bouton Submit -->
        <div>
          <button type="submit" [disabled]="isLoading"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <span *ngIf="isLoading">Connexion en cours...</span>
            <span *ngIf="!isLoading">Se connecter</span>
          </button>
        </div>
      </form>

      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">Pas encore de compte ?</span>
          </div>
        </div>

        <div class="mt-6">
          <a routerLink="/inscription" class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors">
            Créer un compte
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
